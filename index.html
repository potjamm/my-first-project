<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>potjamm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0b0a08;
      --surface: #141210;
      --accent: #d4a853;
      --accent-dim: #8a6c33;
      --text-primary: #f0ece3;
      --text-muted: #5c5648;
      --border: #1e1c18;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      overflow-x: hidden;
      cursor: none;
    }

    /* Custom cursor */
    .cursor {
      position: fixed;
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease;
    }

    .cursor-ring {
      position: fixed;
      width: 36px;
      height: 36px;
      border: 1px solid var(--accent-dim);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.15s ease, width 0.2s ease, height 0.2s ease;
    }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
      opacity: 0.4;
    }

    /* Layout */
    .container {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 3rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      opacity: 0;
      animation: fadeSlideDown 0.8s ease forwards;
      animation-delay: 0.1s;
    }

    .logo {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .date {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-align: right;
      line-height: 1.8;
    }

    /* Main hero */
    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem 0;
    }

    .eyebrow {
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      color: var(--accent-dim);
      text-transform: uppercase;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeSlideUp 0.8s ease forwards;
      animation-delay: 0.4s;
    }

    .name-block {
      position: relative;
      margin-bottom: 0.5rem;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(5rem, 14vw, 11rem);
      font-weight: 300;
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      opacity: 0;
      animation: fadeSlideUp 0.9s ease forwards;
      animation-delay: 0.55s;
    }

    .name em {
      font-style: italic;
      color: var(--accent);
    }

    .name-line {
      display: block;
      height: 1px;
      background: linear-gradient(90deg, var(--accent) 0%, transparent 60%);
      margin: 1.5rem 0 2rem;
      transform: scaleX(0);
      transform-origin: left;
      animation: lineExpand 0.8s ease forwards;
      animation-delay: 0.9s;
    }

    .role-block {
      display: flex;
      align-items: baseline;
      gap: 2rem;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeSlideUp 0.8s ease forwards;
      animation-delay: 1.05s;
    }

    .role {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.5rem, 4vw, 2.8rem);
      font-weight: 300;
      font-style: italic;
      color: var(--text-primary);
    }

    .role-tag {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: var(--accent);
      background: rgba(212, 168, 83, 0.08);
      border: 1px solid rgba(212, 168, 83, 0.2);
      padding: 0.3em 0.8em;
      text-transform: uppercase;
      vertical-align: middle;
    }

    /* Favorite card */
    .fav-section {
      margin-top: 4.5rem;
      opacity: 0;
      animation: fadeSlideUp 0.8s ease forwards;
      animation-delay: 1.25s;
    }

    .fav-label {
      font-size: 0.6rem;
      letter-spacing: 0.35em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 1.2rem;
    }

    .fav-card {
      display: inline-flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1.4rem 2rem;
      border: 1px solid var(--border);
      background: var(--surface);
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s ease;
    }

    .fav-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: var(--accent);
    }

    .fav-card:hover {
      border-color: var(--accent-dim);
    }

    .fav-icon {
      font-size: 1.6rem;
      line-height: 1;
    }

    .fav-text {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .fav-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 400;
      color: var(--text-primary);
      letter-spacing: 0.02em;
    }

    .fav-desc {
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      color: var(--text-muted);
    }

    /* Footer */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      opacity: 0;
      animation: fadeSlideUp 0.8s ease forwards;
      animation-delay: 1.5s;
    }

    .footer-note {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      line-height: 1.8;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--text-muted);
    }

    .status-dot {
      width: 5px;
      height: 5px;
      background: #4caf7d;
      border-radius: 50%;
      animation: pulse 2.5s ease-in-out infinite;
    }

    /* Decorative floating index number */
    .index-num {
      position: fixed;
      right: 3rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: var(--border);
      writing-mode: vertical-rl;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 1.8s;
    }

    /* Animations */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeSlideDown {
      from {
        opacity: 0;
        transform: translateY(-16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes lineExpand {
      to {
        transform: scaleX(1);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 2rem 1.5rem;
      }
      .index-num {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="index-num">NO. 001 — INTRO</div>

  <div class="container">

    <header>
      <span class="logo">potjamm.me</span>
      <div class="date">
        <span>Product Manager</span><br>
        <span>Seoul, KR</span>
      </div>
    </header>

    <main>
      <p class="eyebrow">— Hello, I'm</p>

      <div class="name-block">
        <h1 class="name">pot<em>jamm</em></h1>
      </div>

      <span class="name-line"></span>

      <div class="role-block">
        <span class="role">Product Manager</span>
        <span class="role-tag">making things people love</span>
      </div>

      <div class="fav-section">
        <p class="fav-label">— one thing I love</p>
        <div class="fav-card">
          <span class="fav-icon">☕</span>
          <div class="fav-text">
            <span class="fav-title">A perfectly brewed cup of coffee</span>
            <span class="fav-desc">ritual · focus · quiet mornings</span>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="footer-note">
        <span>Product mind,</span><br>
        <span>human at heart.</span>
      </div>
      <div class="status">
        <span class="status-dot"></span>
        <span>available for coffee chats</span>
      </div>
    </footer>

  </div>

  <script>
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursorRing');

    let mouseX = 0, mouseY = 0;
    let ringX = 0, ringY = 0;

    document.addEventListener('mousemove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';
    });

    function animateRing() {
      ringX += (mouseX - ringX) * 0.12;
      ringY += (mouseY - ringY) * 0.12;
      ring.style.left = ringX + 'px';
      ring.style.top = ringY + 'px';
      requestAnimationFrame(animateRing);
    }
    animateRing();

    document.querySelectorAll('a, .fav-card').forEach(el => {
      el.addEventListener('mouseenter', () => {
        ring.style.width = '56px';
        ring.style.height = '56px';
      });
      el.addEventListener('mouseleave', () => {
        ring.style.width = '36px';
        ring.style.height = '36px';
      });
    });
  </script>

</body>
</html>
